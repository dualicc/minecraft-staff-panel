<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moderation Control Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

/* TOPBAR */
.topbar {
    height: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
}

/* LAYOUT */
.app {
    display: grid;
    grid-template-columns: 260px 1fr 380px;
    height: calc(100vh - 56px);
}

/* SIDEBAR */
.sidebar {
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 12px;
}

.nav-title {
    font-size: 11px;
    opacity: 0.5;
    margin-top: 14px;
}

.nav-item {
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    background: #111827;
    cursor: pointer;
}

.nav-item:hover {
    background: #1f2937;
}

.nav-item.active {
    background: #2563eb;
}

/* CENTER */
.center {
    padding: 16px;
    overflow-y: auto;
}

/* INSPECTOR */
.inspector {
    border-left: 1px solid #1f2937;
    background: #0f172a;
    padding: 16px;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}

.stat {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

/* CASE ROWS */
.case {
    background: #111827;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 120px 120px 1fr 100px;
    align-items: center;
}

.case:hover {
    background: #1f2937;
}

.badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #374151;
}

.status-open { color: #facc15; }
.status-accepted { color: #22c55e; }
.status-denied { color: #ef4444; }
.status-escalated { color: #f97316; }

/* CHAT */
.chat {
    margin-top: 12px;
    border-top: 1px solid #1f2937;
    padding-top: 10px;
}

.msg {
    background: #111827;
    padding: 8px;
    margin-top: 6px;
    border-radius: 6px;
    font-size: 13px;
}

.input {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #111827;
    color: white;
}

button {
    margin-top: 8px;
    margin-right: 6px;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="topbar">
    <div>
        <b>Moderation Panel</b>
        <div class="small">Live System</div>
    </div>
    <div class="small">Admin • Online</div>
</div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="nav-title">OVERVIEW</div>
    <div class="nav-item active" onclick="switchTab('dashboard', this)">Dashboard</div>

    <div class="nav-title">CASES</div>
    <div class="nav-item" onclick="switchTab('reports', this)">Reports</div>
    <div class="nav-item" onclick="switchTab('punishments', this)">Punishments</div>
    <div class="nav-item" onclick="switchTab('appeals', this)">Appeals</div>

    <div class="nav-title">COMMUNICATION</div>
    <div class="nav-item" onclick="switchTab('staffchat', this)">Staff Chat</div>

</div>

<!-- CENTER -->
<div class="center">

<!-- DASHBOARD -->
<div id="dashboard" class="tab">

    <div class="stats">
        <div class="stat"><b>Players</b><p id="p">0</p></div>
        <div class="stat"><b>Reports</b><p id="r">0</p></div>
        <div class="stat"><b>Appeals</b><p id="a">0</p></div>
        <div class="stat"><b>Staff</b><p id="s">0</p></div>
    </div>

</div>

<!-- REPORTS -->
<div id="reports" class="tab">

    <h3>Reports</h3>

    <div class="case" onclick="openCase('Steve','Griefing','Destroyed spawn','Screenshots')">
        Steve <span class="badge">Grief</span>
        <div>Destroyed spawn</div>
        <div class="status-open">OPEN</div>
    </div>

</div>

<!-- PUNISHMENTS -->
<div id="punishments" class="tab" style="display:none;">
    <h3>Punishments</h3>
</div>

<!-- APPEALS -->
<div id="appeals" class="tab" style="display:none;">
    <h3>Appeals</h3>
</div>

<!-- STAFF CHAT -->
<div id="staffchat" class="tab" style="display:none;">

    <h3>Staff Chat</h3>

    <div id="staffBox"></div>

    <input class="input" id="staffMsg" placeholder="Message staff...">
    <button onclick="sendStaff()">Send</button>

</div>

</div>

<!-- INSPECTOR -->
<div class="inspector" id="inspector">

    <h3>Case Panel</h3>
    <p class="small">Select a case</p>

</div>

</div>

<script>

let currentUser = "";

function switchTab(tab, el){

    document.querySelectorAll(".tab").forEach(t => t.style.display = "none");
    document.getElementById(tab).style.display = "block";

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    el.classList.add("active");
}

function openCase(user,type,reason,evidence){

    currentUser = user;

    document.getElementById("inspector").innerHTML = `
        <h3>${user}</h3>
        <p><b>${type}</b></p>
        <p>${reason}</p>
        <p class="small">${evidence}</p>

        <hr style="border:1px solid #1f2937">

        <button onclick="action('ACCEPTED')">Accept</button>
        <button onclick="action('DENIED')">Deny</button>
        <button onclick="action('ESCALATED')">Escalate</button>

        <div class="chat">

            <b>Case Chat (Staff ↔ Player)</b>

            <div id="chat"></div>

            <input class="input" id="msg" placeholder="Message...">
            <button onclick="sendMsg()">Send</button>

        </div>
    `;
}

function action(type){
    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>${type}</b> - Case updated for ${currentUser}</div>`;
}

function sendMsg(){
    let m = document.getElementById("msg").value;
    if(!m) return;

    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>Staff:</b> ${m}</div>`;

    document.getElementById("msg").value = "";
}

function sendStaff(){
    let m = document.getElementById("staffMsg").value;
    if(!m) return;

    document.getElementById("staffBox").innerHTML +=
    `<div class="msg">${m}</div>`;

    document.getElementById("staffMsg").value = "";
}

function updateStats(){
    document.getElementById("p").innerText = Math.floor(Math.random()*1000);
    document.getElementById("r").innerText = Math.floor(Math.random()*50);
    document.getElementById("a").innerText = Math.floor(Math.random()*30);
    document.getElementById("s").innerText = Math.floor(Math.random()*20);
}

updateStats();
setInterval(updateStats,2000);

</script>

</body>
</html>
