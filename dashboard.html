<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moderation Control Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

.topbar {
    height: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
}

/* LAYOUT */
.app {
    display: grid;
    grid-template-columns: 260px 1fr 380px;
    height: calc(100vh - 56px);
}

/* SIDEBAR */
.sidebar {
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 12px;
}

.nav-title {
    font-size: 11px;
    opacity: 0.5;
    margin-top: 14px;
}

.nav-item {
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    background: #111827;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
}

.nav-item:hover {
    background: #1f2937;
}

.nav-item.active {
    background: #2563eb;
}

/* CENTER */
.center {
    padding: 16px;
    overflow-y: auto;
}

/* INSPECTOR */
.inspector {
    border-left: 1px solid #1f2937;
    background: #0f172a;
    padding: 16px;
    overflow-y: auto;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

/* TOOLBAR */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: none;
    outline: none;
    background: #111827;
    color: white;
}

/* CASE LIST */
.case {
    background: #111827;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
}

.case:hover {
    background: #1f2937;
}

.badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #374151;
    margin-left: 6px;
}

.status-open { color: #facc15; }
.status-closed { color: #22c55e; }
.status-escalated { color: #ef4444; }

button {
    margin-top: 10px;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}

.timeline {
    margin-top: 10px;
    padding-left: 10px;
    border-left: 2px solid #1f2937;
}

.log {
    font-size: 12px;
    margin-bottom: 6px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="topbar">
    <div>
        <b>Moderation Control Panel</b>
        <div class="small">Live case system</div>
    </div>
    <div class="small">Admin • Online</div>
</div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="nav-title">OVERVIEW</div>
    <div class="nav-item active" onclick="switchTab('dashboard', this)">Dashboard</div>

    <div class="nav-title">CASES</div>
    <div class="nav-item" onclick="switchTab('reports', this)">Reports</div>
    <div class="nav-item" onclick="switchTab('punishments', this)">Punishments</div>
    <div class="nav-item" onclick="switchTab('appeals', this)">Appeals</div>

</div>

<!-- CENTER -->
<div class="center">

<!-- DASHBOARD -->
<div id="dashboard" class="tab">

    <div class="stats">
        <div class="stat"><b>Players</b><p id="p">0</p></div>
        <div class="stat"><b>Reports</b><p id="r">0</p></div>
        <div class="stat"><b>Appeals</b><p id="a">0</p></div>
        <div class="stat"><b>Staff</b><p id="s">0</p></div>
    </div>

</div>

<!-- REPORTS -->
<div id="reports" class="tab" style="display:none;">

    <div class="toolbar">
        <input placeholder="Search reports..." oninput="filterCases(this.value)">
    </div>

    <div id="caseList">

        <div class="case" onclick="openCase('Steve','Griefing','Destroyed multiple spawn builds','Evidence: screenshots','open')">
            Steve <span class="badge">Grief</span> <span class="status-open">OPEN</span>
        </div>

        <div class="case" onclick="openCase('Alex','Chat Abuse','Toxic messages in chat','Logs attached','open')">
            Alex <span class="badge">Chat</span> <span class="status-open">OPEN</span>
        </div>

        <div class="case" onclick="openCase('Notch','Hacking','X-Ray usage detected','Mining pattern data','escalated')">
            Notch <span class="badge">Hack</span> <span class="status-escalated">ESCALATED</span>
        </div>

    </div>

</div>

<!-- PUNISHMENTS -->
<div id="punishments" class="tab" style="display:none;">

    <div class="case" onclick="openCase('Notch','Ban','Permanent ban issued','X-Ray confirmed','closed')">
        Notch <span class="status-closed">CLOSED</span>
    </div>

</div>

<!-- APPEALS -->
<div id="appeals" class="tab" style="display:none;">

    <div class="case" onclick="openCase('Steve','Appeal','Ban appeal submitted','User statement included','open')">
        Steve Appeal <span class="status-open">PENDING</span>
    </div>

</div>

</div>

<!-- INSPECTOR -->
<div class="inspector" id="inspector">

    <h3>Case Viewer</h3>
    <p class="small">Select a case to view full details</p>

</div>

</div>

<script>

function switchTab(id, el){

    document.querySelectorAll(".tab").forEach(t => t.style.display = "none");
    document.getElementById(id).style.display = "block";

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    el.classList.add("active");
}

function openCase(user,type,reason,evidence,status){

    const time = new Date().toLocaleString();

    document.getElementById("inspector").innerHTML = `
        <h3>${user}</h3>
        <p><b>Type:</b> ${type}</p>
        <p><b>Status:</b> ${status}</p>

        <hr style="border:1px solid #1f2937">

        <p><b>Reason:</b> ${reason}</p>
        <p><b>Evidence:</b> ${evidence}</p>

        <p class="small"><b>Opened:</b> ${time}</p>

        <div class="timeline">
            <div class="log">Case created</div>
            <div class="log">Assigned to moderation queue</div>
            <div class="log">Under review</div>
        </div>

        <hr style="border:1px solid #1f2937">

        <button onclick="this.parentElement.innerHTML='Resolved ✔'">Resolve</button>
        <button onclick="this.parentElement.innerHTML='Escalated ⬆'">Escalate</button>
    `;
}

function filterCases(value){
    const cases = document.querySelectorAll(".case");
    cases.forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(value.toLowerCase()) ? "block" : "none";
    });
}

function update(){
    document.getElementById("p").textContent = Math.floor(Math.random()*900+300);
    document.getElementById("r").textContent = Math.floor(Math.random()*40);
    document.getElementById("a").textContent = Math.floor(Math.random()*25);
    document.getElementById("s").textContent = Math.floor(Math.random()*30+5);
}

update();
setInterval(update,2000);

</script>

</body>
</html>
