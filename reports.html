<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="topbar">
    <h1>Reports</h1>
</div>

<div class="content">

    <div class="cards">

        <div class="card">
            <h3>Report List</h3>

            <div class="report" onclick="openReport('Steve')">Griefing - Steve</div>
            <div class="report" onclick="openReport('Alex')">Chat Abuse - Alex</div>
            <div class="report" onclick="openReport('Notch')">Hacking - Notch</div>

        </div>

        <div class="card" id="reportBox">
            <h3>Details</h3>
            <p>Select a report</p>
        </div>

    </div>

</div>

<script>
function openReport(name) {
    const box = document.getElementById("reportBox");

    if (name === "Steve") {
        box.innerHTML = "<h3>Steve</h3><p>Griefing report</p><button onclick='resolve(this)'>Resolve</button>";
    }

    if (name === "Alex") {
        box.innerHTML = "<h3>Alex</h3><p>Chat abuse report</p><button onclick='resolve(this)'>Resolve</button>";
    }

    if (name === "Notch") {
        box.innerHTML = "<h3>Notch</h3><p>Hacking report</p><button onclick='resolve(this)'>Resolve</button>";
    }
}

function resolve(btn) {
    btn.parentElement.innerHTML = "<p style='color:lime;'>Resolved ✔</p>";
}
</script>

</body>
</html>
