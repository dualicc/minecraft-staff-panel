<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

/* TOPBAR */
.topbar {
    display: flex;
    justify-content: space-between;
    padding: 14px 18px;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
}

/* LAYOUT */
.app {
    display: grid;
    grid-template-columns: 240px 1fr 360px;
    height: calc(100vh - 56px);
}

/* SIDEBAR */
.sidebar {
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 10px;
}

.nav-item {
    padding: 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    background: #111827;
    cursor: pointer;
    font-size: 14px;
}

.nav-item:hover {
    background: #1f2937;
}

.nav-item.active {
    background: #2563eb;
}

/* CENTER */
.center {
    padding: 14px;
    overflow-y: auto;
}

/* CASE QUEUE (IMPORTANT FIX) */
.case {
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #111827;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;

    cursor: pointer;
    transition: 0.15s;
}

.case:hover {
    background: #1f2937;
}

.case-left {
    display: flex;
    flex-direction: column;
}

.case-title {
    font-weight: bold;
}

.case-sub {
    font-size: 12px;
    opacity: 0.7;
}

/* STATUS TAGS */
.tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: #374151;
}

.open { color: #facc15; }
.good { color: #22c55e; }
.bad { color: #ef4444; }
.warn { color: #f97316; }

/* INSPECTOR */
.inspector {
    border-left: 1px solid #1f2937;
    background: #0f172a;
    padding: 14px;
}

/* CHAT */
.msg {
    background: #111827;
    padding: 7px;
    margin-top: 6px;
    border-radius: 6px;
    font-size: 13px;
}

.input {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #111827;
    color: white;
}

button {
    margin-top: 8px;
    margin-right: 6px;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.stat {
    background: #111827;
    padding: 10px;
    border-radius: 8px;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>

</head>

<body>

<div class="topbar">
    <div>
        <b>Moderation Panel</b>
        <div class="small">Live System</div>
    </div>
    <div class="small">Admin Online</div>
</div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="nav-item active" onclick="switchTab(this)">Dashboard</div>
    <div class="nav-item" onclick="switchTab(this)">Reports</div>
    <div class="nav-item" onclick="switchTab(this)">Punishments</div>
    <div class="nav-item" onclick="switchTab(this)">Appeals</div>
    <div class="nav-item" onclick="switchTab(this)">Staff Chat</div>
    <div class="nav-item" onclick="switchTab(this)">Logs</div>

</div>

<!-- CENTER -->
<div class="center">

<div class="stats">
    <div class="stat"><b>Players</b><div id="p">0</div></div>
    <div class="stat"><b>Reports</b><div id="r">0</div></div>
    <div class="stat"><b>Appeals</b><div id="a">0</div></div>
    <div class="stat"><b>Staff</b><div id="s">0</div></div>
</div>

<h3>Reports Queue</h3>

<div class="case" onclick="openCase('Steve','Griefing spawn','OPEN')">
    <div class="case-left">
        <div class="case-title">Steve</div>
        <div class="case-sub">Griefing spawn area</div>
    </div>
    <div class="tag open">OPEN</div>
</div>

<div class="case" onclick="openCase('Alex','Chat abuse','OPEN')">
    <div class="case-left">
        <div class="case-title">Alex</div>
        <div class="case-sub">Spam + toxicity</div>
    </div>
    <div class="tag open">OPEN</div>
</div>

</div>

<!-- INSPECTOR -->
<div class="inspector" id="inspector">
    <h3>Select a case</h3>
</div>

</div>

<script>

let active = null;

/* SIDEBAR */
function switchTab(el){
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    el.classList.add("active");
}

/* CASE OPEN */
function openCase(user, reason, status){

    active = user;

    document.getElementById("inspector").innerHTML = `
        <h3>${user}</h3>
        <p class="small">${reason}</p>
        <p>Status: ${status}</p>

        <button onclick="action('ACCEPTED')">Accept</button>
        <button onclick="action('DENIED')">Deny</button>
        <button onclick="action('ESCALATED')">Escalate</button>

        <hr>

        <b>Case Chat</b>
        <div id="chat"></div>

        <input class="input" id="msg" placeholder="Message...">
        <button onclick="send()">Send</button>
    `;

}

/* CHAT */
function send(){
    let m = document.getElementById("msg").value;
    if(!m) return;

    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>Staff:</b> ${m}</div>`;

    document.getElementById("msg").value = "";
}

/* ACTIONS */
function action(type){
    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>Status:</b> ${type}</div>`;
}

/* STATS FAKE LIVE */
setInterval(() => {
    document.getElementById("p").innerText = Math.floor(Math.random()*900);
    document.getElementById("r").innerText = Math.floor(Math.random()*40);
    document.getElementById("a").innerText = Math.floor(Math.random()*25);
    document.getElementById("s").innerText = Math.floor(Math.random()*20);
}, 2000);

</script>

</body>
</html>
