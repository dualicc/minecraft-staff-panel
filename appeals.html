<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appeals</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="topbar">
    <h1>Appeals</h1>
</div>

<div class="content">

    <div class="cards">

        <div class="card">
            <h3>Appeals</h3>

            <div onclick="openA('Steve')">Ban Appeal - Steve</div>
            <div onclick="openA('Alex')">Mute Appeal - Alex</div>

        </div>

        <div class="card" id="appealBox">
            <h3>Details</h3>
            <p>Select appeal</p>
        </div>

    </div>

</div>

<script>
function openA(name) {
    const box = document.getElementById("appealBox");

    box.innerHTML = `
        <h3>${name} Appeal</h3>
        <p>Reason: I want unban/unmute</p>
        <button onclick="this.parentElement.innerHTML='Approved ✔'">Approve</button>
        <button onclick="this.parentElement.innerHTML='Denied ✖'">Deny</button>
    `;
}
</script>

</body>
</html>
