<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Punishments</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="topbar">
    <h1>Punishments</h1>
</div>

<div class="content">

    <div class="cards">

        <div class="card">
            <h3>Players</h3>

            <div class="player" onclick="show('Steve')">Steve</div>
            <div class="player" onclick="show('Alex')">Alex</div>
            <div class="player" onclick="show('Notch')">Notch</div>

        </div>

        <div class="card" id="historyBox">
            <h3>History</h3>
            <p>Select a player</p>
        </div>

    </div>

</div>

<script>
function show(name) {
    const box = document.getElementById("historyBox");

    if (name === "Steve") {
        box.innerHTML = "<h3>Steve</h3><p>Warned + Muted</p>";
    }

    if (name === "Alex") {
        box.innerHTML = "<h3>Alex</h3><p>No punishments</p>";
    }

    if (name === "Notch") {
        box.innerHTML = "<h3>Notch</h3><p>Banned (X-Ray)</p>";
    }
}
</script>

</body>
</html>
