<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="topbar">
    <h1>Reports</h1>
</div>

<div class="content">

    <div class="cards">

        <div class="card">
            <h3>Report List</h3>

            <div class="report" onclick="openReport('Griefing')">Griefing - Steve</div>
            <div class="report" onclick="openReport('Chat Abuse')">Chat Abuse - Alex</div>
            <div class="report" onclick="openReport('Hacking')">Hacking - Notch</div>

        </div>

        <div class="card" id="reportBox">
            <h3>Details</h3>
            <p>Select a report</p>
        </div>

    </div>

</div>

<script>
function openReport(type) {
    const box = document.getElementById("reportBox");

    if (type === "Griefing") {
        box.innerHTML = `
            <h3>Griefing - Steve</h3>
            <p>Player destroyed builds</p>
            <button onclick="resolve(this)">Resolve</button>
        `;
    }

    if (type === "Chat Abuse") {
        box.innerHTML = `
            <h3>Chat Abuse - Alex</h3>
            <p>Toxic chat behavior</p>
            <button onclick="resolve(this)">Resolve</button>
        `;
    }

    if (type === "Hacking") {
        box.innerHTML = `
            <h3>Hacking - Notch</h3>
            <p>Suspected X-Ray</p>
            <button onclick="resolve(this)">Resolve</button>
        `;
    }
}

function resolve(btn) {
    btn.parentElement.innerHTML = "<p style='color:lime;'>Resolved ✔</p>";
}
</script>

</body>
</html>
