<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* TOPBAR */
.topbar {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    background: #111827;
    border-bottom: 1px solid #1f2937;
}

/* LAYOUT */
.app {
    display: grid;
    grid-template-columns: 240px 1fr 340px;
    height: calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar {
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 10px;
}

.nav-item {
    padding: 10px;
    margin-bottom: 6px;
    background: #111827;
    border-radius: 6px;
    cursor: pointer;
}

.nav-item:hover {
    background: #1f2937;
}

.nav-item.active {
    background: #2563eb;
}

/* CENTER */
.center {
    padding: 12px;
    overflow-y: auto;
}

.tab { display: none; }
.tab.active { display: block; }

/* CASE */
.case {
    background: #111827;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.case:hover {
    background: #1f2937;
}

/* INSPECTOR */
.inspector {
    border-left: 1px solid #1f2937;
    padding: 12px;
    background: #0f172a;
}

/* CHAT */
.msg {
    background: #111827;
    padding: 6px;
    margin-top: 6px;
    border-radius: 6px;
    font-size: 13px;
}

.input {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #111827;
    color: white;
}

button {
    margin-top: 8px;
    margin-right: 6px;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>

</head>

<body>

<div class="topbar">
    <div>
        <b>Staff Dashboard</b>
        <div class="small">Moderation System</div>
    </div>
    <div class="small">Admin Online</div>
</div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="nav-item active" onclick="switchTab('reports', this)">Reports</div>
    <div class="nav-item" onclick="switchTab('punishments', this)">Punishments</div>
    <div class="nav-item" onclick="switchTab('appeals', this)">Appeals</div>
    <div class="nav-item" onclick="switchTab('staffchat', this)">Staff Chat</div>
    <div class="nav-item" onclick="switchTab('logs', this)">Logs</div>

</div>

<!-- CENTER -->
<div class="center">

<!-- REPORTS -->
<div id="reports" class="tab active">

    <h3>Reports</h3>

    <div class="case" onclick="openCase('Steve','Griefing','Destroyed spawn','Screenshots')">
        Steve - Griefing
    </div>

</div>

<!-- PUNISHMENTS -->
<div id="punishments" class="tab">
    <h3>Punishments</h3>
</div>

<!-- APPEALS -->
<div id="appeals" class="tab">
    <h3>Appeals</h3>
</div>

<!-- STAFF CHAT -->
<div id="staffchat" class="tab">

    <h3>Staff Chat</h3>

    <div id="staffBox"></div>

    <input class="input" id="staffMsg" placeholder="Message staff...">
    <button onclick="sendStaff()">Send</button>

</div>

<!-- LOGS -->
<div id="logs" class="tab">

    <h3>System Logs</h3>

    <div id="logBox"></div>

</div>

</div>

<!-- INSPECTOR -->
<div class="inspector" id="inspector">

    <h3>Select a case</h3>

</div>

</div>

<script>

let activeCase = null;

let logs = [];
let staffChat = [];

function switchTab(tab, el){

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById(tab).classList.add("active");

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    el.classList.add("active");
}

/* CASE SYSTEM */
function openCase(user,type,reason,evidence){

    activeCase = {user,type,reason,evidence,messages:[],status:"OPEN"};

    document.getElementById("inspector").innerHTML = `

        <h3>${user}</h3>
        <p>${type}</p>
        <p class="small">${reason}</p>

        <button onclick="setStatus('ACCEPTED')">Accept</button>
        <button onclick="setStatus('DENIED')">Deny</button>
        <button onclick="setStatus('ESCALATED')">Escalate</button>

        <hr>

        <b>Case Chat</b>
        <div id="caseChat"></div>

        <input class="input" id="msg" placeholder="Message...">
        <button onclick="sendCaseMsg()">Send</button>
    `;

    renderCaseChat();
}

function sendCaseMsg(){

    let msg = document.getElementById("msg").value;
    if(!msg) return;

    activeCase.messages.push(msg);

    log("Case message sent");

    renderCaseChat();

    document.getElementById("msg").value = "";
}

function renderCaseChat(){

    let box = document.getElementById("caseChat");
    if(!box) return;

    box.innerHTML = "";

    activeCase.messages.forEach(m => {
        box.innerHTML += `<div class="msg">Staff: ${m}</div>`;
    });
}

/* STATUS */
function setStatus(status){
    activeCase.status = status;
    log(`Case for ${activeCase.user} → ${status}`);
}

/* STAFF CHAT */
function sendStaff(){

    let msg = document.getElementById("staffMsg").value;
    if(!msg) return;

    staffChat.push(msg);

    renderStaff();

    log("Staff message sent");

    document.getElementById("staffMsg").value = "";
}

function renderStaff(){

    let box = document.getElementById("staffBox");
    box.innerHTML = "";

    staffChat.forEach(m => {
        box.innerHTML += `<div class="msg">${m}</div>`;
    });
}

/* LOGS */
function log(text){

    logs.push(text);

    let box = document.getElementById("logBox");
    box.innerHTML = "";

    logs.forEach(l => {
        box.innerHTML += `<div class="msg">${l}</div>`;
    });
}

</script>

</body>
</html>
