<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #111827;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .title {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2 class="title">Staff Panel Login</h2>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
