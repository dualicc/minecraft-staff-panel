<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Panel | Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="sidebar">
    <div class="logo">Staff Panel</div>

    <a href="dashboard.html">Dashboard</a>
    <a href="reports.html">Reports</a>
    <a href="appeals.html">Appeals</a>
    <a href="punishments.html">Punishments</a>
    <a href="players.html">Players</a>
    <a href="staff.html">Staff</a>
    <a href="analytics.html">Analytics</a>
    <a href="audit-log.html">Audit Log</a>
    <a href="settings.html" class="active">Settings</a>
  </div>

  <div class="main">

    <div class="topbar">
      <h1>Settings</h1>
      <div class="user">
        <span class="status"></span>
        Admin Panel
      </div>
    </div>

    <div class="panel">

      <h2>Panel Settings</h2>

      <form>

        <label>Panel Name</label>
        <input type="text" value="Staff Panel" />

        <label>Theme Color</label>
        <input type="text" value="#38bdf8" />

        <label>Default Rank View</label>
        <select>
          <option>Admin</option>
          <option>Moderator</option>
          <option>Helper</option>
        </select>

        <label>Auto Refresh (seconds)</label>
        <input type="number" value="30" />

        <button type="button">Save Settings</button>

      </form>

    </div>

  </div>

</body>
</html>
